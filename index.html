<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUNK PLANNER - Smart Attendance</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--green:#00ff88;--yellow:#ffcc00;--red:#ff3b3b;--blue:#00c2ff;}
  body{margin:0;background:var(--bg);color:#fff;font-family:'Segoe UI',sans-serif;}
  header{text-align:center;padding:25px;background:#15181f;border-bottom:2px solid var(--blue);}
  header h1{margin:0;color:var(--blue);letter-spacing:2px;}
  .container{max-width:900px;margin:auto;padding:20px;}
  .add-box{background:var(--card);padding:20px;border-radius:15px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;}
  input{padding:12px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#fff;width:100%;box-sizing:border-box;}
  button{padding:12px 18px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
  .btn-add{background:var(--blue);color:#000;}
  .btn-del{background:#2a2a2a;color:var(--red);}
  .cards{margin-top:25px;display:grid;gap:15px;}
  .subject-card{background:var(--card);padding:20px;border-radius:15px;border-left:5px solid var(--green);display:grid;grid-template-columns:1fr auto;gap:15px;}
  .subject-card.warn{border-left-color:var(--yellow);}
  .subject-card.danger{border-left-color:var(--red);}
  .progress{height:10px;background:#222;border-radius:10px;overflow:hidden;margin:10px 0;}
  .progress-bar{height:100%;transition:0.5s;}
  .stats{display:flex;gap:15px;flex-wrap:wrap;margin-top:10px;}
  .stat{background:#0f1115;padding:10px 12px;border-radius:8px;font-size:13px;}
  .stat b{color:var(--blue);}
  .bunk-num{font-size:28px;font-weight:900;}
  .safe{color:var(--green);}.warn-txt{color:var(--yellow);}.danger-txt{color:var(--red);}
  footer{text-align:center;padding:30px;opacity:0.5;font-size:12px;}
  @media(max-width:600px){.add-box{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>BUNK PLANNER</h1>
  <p>How many classes can you bunk without getting debarred? 🎓</p>
  <p style="font-size:13px;opacity:0.7">Required: 75% (editable) | Auto-saves</p>
</header>

<div class="container">
  <div class="add-box">
    <div><label>Subject Name</label><input id="subName" placeholder="e.g. DBMS"></div>
    <div><label>Total Classes</label><input id="total" type="number" placeholder="e.g. 40"></div>
    <div><label>Attended</label><input id="attended" type="number" placeholder="e.g. 30"></div>
    <div><button class="btn-add" onclick="addSubject()">+ ADD</button></div>
  </div>

  <div style="margin-top:20px;display:flex;gap:10px;align-items:center;">
    <label>Required %: </label>
    <input id="reqPer" type="number" value="75" style="width:80px;" onchange="render()">
    <button onclick="clearAll()" style="margin-left:auto;background:#111;color:#aaa;">Clear All</button>
  </div>

  <div class="cards" id="cards"></div>

  <div id="summary" style="margin-top:30px;background:linear-gradient(90deg,#00c2ff20,#00ff8820);padding:20px;border-radius:15px;"></div>
</div>

<footer>Mini Project | Department of Computer Science | Made with JS + LocalStorage</footer>

<script>
let subjects = JSON.parse(localStorage.getItem('bunkData') || '[]');

function calc(a,t,r){
  let perc = t==0?0:(a/t*100);
  let bunkable = Math.floor((a*100/r) - t);
  let need = 0;
  if(bunkable < 0){
    need = Math.ceil((r*t - 100*a)/(100 - r));
    bunkable = 0;
  }
  return {perc, bunkable, need};
}

function addSubject(){
  let name = document.getElementById('subName').value.trim();
  let t = parseInt(document.getElementById('total').value);
  let a = parseInt(document.getElementById('attended').value);
  if(!name || isNaN(t) || isNaN(a)){alert('Fill all fields');return;}
  subjects.push({name,t,a});
  save(); render();
  document.getElementById('subName').value='';document.getElementById('total').value='';document.getElementById('attended').value='';
}

function del(i){subjects.splice(i,1);save();render();}
function save(){localStorage.setItem('bunkData', JSON.stringify(subjects));}
function clearAll(){if(confirm('Delete all?')){subjects=[];save();render();}}

function render(){
  let r = parseFloat(document.getElementById('reqPer').value) || 75;
  let html = '';
  let totalSafeBunks = 0;
  subjects.forEach((s,i)=>{
    let c = calc(s.a,s.t,r);
    let cls = c.bunkable>2?'': c.bunkable>0?'warn':'danger';
    let col = c.bunkable>2?'#00ff88': c.bunkable>0?'#ffcc00':'#ff3b3b';
    let statusText = c.need>0?`You must attend next <b class="danger-txt">${c.need}</b> classes!`:`You can bunk <b class="safe">${c.bunkable}</b> more classes`;
    totalSafeBunks += c.bunkable;
    html += `<div class="subject-card ${cls}">
      <div>
        <div style="display:flex;gap:10px;align-items:center;"><h3 style="margin:0">${s.name}</h3><span style="opacity:0.6">${s.a}/${s.t} - ${c.perc.toFixed(1)}%</span></div>
        <div class="progress"><div class="progress-bar" style="width:${Math.min(c.perc,100)}%;background:${col}"></div></div>
        <div class="stats">
          <div class="stat">Attendance: <b>${c.perc.toFixed(1)}%</b></div>
          <div class="stat bunk-num ${c.need>0?'danger-txt':c.bunkable>0?'warn-txt':'safe'}">${c.need>0?`NEED ${c.need}`:`BUNK ${c.bunkable}`}</div>
        </div>
        <p style="margin:10px 0 0;font-size:14px;">${statusText}</p>
      </div>
      <div><button class="btn-del" onclick="del(${i})">✕</button></div>
    </div>`;
  });
  document.getElementById('cards').innerHTML = html || '<p style="text-align:center;opacity:0.5;margin-top:30px;">No subjects added yet. Add your first subject above.</p>';
  document.getElementById('summary').innerHTML = `<b>Summary:</b> Total safe bunks across all subjects: <b style="color:#00ff88;font-size:20px">${totalSafeBunks}</b> | Required: ${r}% | Tip: Keep above ${r}% to avoid debar.`;
}

render();
</script>
</body>
</html>
